name: CI
on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Continuous Integration
    uses: ./.github/workflows/ci.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Deliberately not `needs: ci`. The matrix is faster than ci, so running it in
  # parallel hides it entirely inside ci's runtime rather than adding to the
  # critical path. The trade is that a failing ci still spends the matrix runners.
  matrix:
    name: Run Tests
    uses: ./.github/workflows/run-test.yml

  # Needs the matrix as well as ci, so the committed badge only ever reflects a
  # commit that passed every supported PHP and Laravel combination. `ci` stays in
  # `needs` because its coverage output is read below.
  badge:
    needs: [ci, matrix]
    name: Generate Coverage Badge
    uses: ./.github/workflows/badge.yml
    with:
      coverage: ${{ needs.ci.outputs.coverage }}
