sonar.projectKey=Accredifysg_SingPass-Login
sonar.projectName=SingPass-Login

# sources and tests
sonar.sources=src
sonar.tests=tests

# coverage (reports are downloaded into these directories by the shared sonar-scan workflow)
sonar.php.coverage.reportPaths=coverage_BE/clover.xml
sonar.php.tests.reportPath=junit_BE/junit.xml
sonar.exclusions=coverage_BE/**,junit_BE/**

# Coverage Exclusions
sonar.coverage.exclusions=tests/**,schema/**

# Duplication Exclusions
sonar.cpd.exclusions=tests/**,schema/**
