name: Run Tests

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.dependency-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['12.*']
        dependency-version: [prefer-lowest, prefer-stable]
        include:
          - laravel: '12.*'
            testbench: '10.*'

    steps:
      # Checkout Code (current branch)
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # Install PHP
      - name: Setup PHP, with composer and extensions
        uses: shivammathur/setup-php@v2 #https://github.com/shivammathur/setup-php
        with:
          php-version: ${{ matrix.php }}
          extensions: gmp, mbstring, openssl, sqlite, pdo_sqlite
          coverage: none

      # Surface PHP/PHPUnit failures as inline annotations
      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      # Resolve a fresh dependency tree for this matrix leg. The committed
      # composer.lock is deliberately bypassed so each leg tests real
      # resolution rather than a single pinned tree.
      - name: Install Composer dependencies
        run: |
          composer require --dev --no-update --no-interaction \
            "laravel/framework:${{ matrix.laravel }}" \
            "orchestra/testbench:${{ matrix.testbench }}"
          composer update --${{ matrix.dependency-version }} \
            --prefer-dist --no-interaction --no-progress

      # Run tests
      - name: Execute tests
        run: vendor/bin/phpunit
