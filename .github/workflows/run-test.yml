name: Run Tests

# Reusable only. Called by feature.yml (pull requests) and merge_to_master.yml
# (pushes to master), in both cases gated behind the `ci` job. Concurrency is
# owned by the calling workflow, so it is deliberately not declared here.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.dependency-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: true
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['11.*', '12.*']
        dependency-version: [prefer-stable]
        include:
          - laravel: '11.*'
            testbench: '9.*'
          - laravel: '12.*'
            testbench: '10.*'
        exclude:
          # Laravel 11 predates PHP 8.5 and was never supported on it.
          - php: '8.5'
            laravel: '11.*'

    steps:
      # Checkout Code (current branch)
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # Install PHP
      - name: Setup PHP, with composer and extensions
        uses: shivammathur/setup-php@v2 #https://github.com/shivammathur/setup-php
        with:
          php-version: ${{ matrix.php }}
          extensions: gmp, mbstring, openssl, sqlite, pdo_sqlite
          coverage: none

      # Registers regexes (written by setup-php) so PHP and PHPUnit output from
      # later steps becomes inline PR annotations. Cosmetic — cannot affect
      # pass/fail, and silently does nothing if a path is wrong.
      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      # Resolve a fresh dependency tree for this matrix leg. The committed
      # composer.lock is deliberately bypassed so each leg tests real
      # resolution rather than a single pinned tree.
      - name: Install Composer dependencies
        run: |
          composer require --dev --no-update --no-interaction "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}"
          composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction --no-progress

      # Run tests. --no-coverage is required because phpunit.xml declares a
      # clover report: with `coverage: none` above there is no driver to
      # satisfy it, and PHPUnit exits non-zero on that runner warning.
      # Coverage stays owned by ci.yml, which runs with xdebug.
      - name: Execute tests
        run: vendor/bin/phpunit --no-coverage
